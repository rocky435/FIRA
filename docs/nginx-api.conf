# nginx site for api.letsfira.com - the backend API (PM2 `fira-api` on :5000).
#
# Install on the server:
#   sudo cp ~/Fira/docs/nginx-api.conf /etc/nginx/sites-available/api.letsfira.com
#   sudo ln -sf /etc/nginx/sites-available/api.letsfira.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The certificate paths are the ones Certbot created for api.letsfira.com.

server {
    listen 80;
    server_name api.letsfira.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.letsfira.com;

    ssl_certificate /etc/letsencrypt/live/api.letsfira.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.letsfira.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads allow up to 5 images of 10 MB each (routes/upload.js,
    # services/uploadService.js); nginx's 1 MB default would reject them with 413.
    client_max_body_size 55m;

    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;

        # The API runs with `trust proxy` 1 and reads the visitor's address from
        # X-Forwarded-For. Without it every request looks like 127.0.0.1, and the
        # login/sign-up rate limits would be shared by every user at once.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Payment and upload calls can take a while; nginx's 60 s default is the floor.
        proxy_read_timeout 120s;
    }
}
