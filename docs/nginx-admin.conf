# nginx site for admin.letsfira.com - the admin dashboard as static files.
#
# deploy.sh builds admin/dist and copies it to /var/www/fira-admin; nginx serves
# it from there. No Node process: the admin is plain HTML/JS/CSS that talks to
# api.letsfira.com from the browser.
#
# Install on the server (replaces the old proxy to :3001):
#   sudo cp ~/Fira/docs/nginx-admin.conf /etc/nginx/sites-available/admin.letsfira.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# The certificate paths are the ones Certbot created for admin.letsfira.com.

server {
    listen 80;
    server_name admin.letsfira.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.letsfira.com;

    ssl_certificate /etc/letsencrypt/live/admin.letsfira.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.letsfira.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/fira-admin;
    index index.html;

    # The admin is a single-page app: any path that is not a real file is a
    # client-side route (/venues/123), so it gets index.html.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must never be cached, or a deploy is not picked up.
        add_header Cache-Control "no-cache";
    }

    # Built assets have content hashes in their names; cache them for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
