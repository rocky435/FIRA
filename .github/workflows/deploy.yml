name: Deploy to EC2

on:
  push:
    branches:
      - main
      - production
      # The default branch. It was missing, so no check ever ran on it. The
      # deploy job below is still gated to main/production, so pushes here
      # (and pull requests) run the checks only - they never deploy.
      - master
  pull_request:
  workflow_dispatch:

env:
  EC2_USER: ec2-user
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
  DEPLOY_PATH: /home/ec2-user/fira
  # Next.js 16 needs Node 20.9+; Node 18 is end-of-life.
  NODE_VERSION: "22"

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for debug files in server root
        run: |
          DEBUG_FILES="testServer.js testServer2.js testServer3.js testServer4.js debugEventData.js tmp_check_events.js"
          FOUND=""
          for f in $DEBUG_FILES; do
            if [ -f "server/$f" ]; then
              FOUND="$FOUND $f"
            fi
          done
          if [ -n "$FOUND" ]; then
            echo "::error::Debug files detected in server root:$FOUND"
            exit 1
          fi

      - name: Typecheck (server)
        run: npx tsc --noEmit
        working-directory: server

      - name: Typecheck (client)
        run: npx tsc --noEmit
        working-directory: client

      - name: Lint (admin)
        run: npm run lint
        working-directory: admin

      - name: Lint (client)
        run: npm run lint
        working-directory: client

      - name: Test (server)
        run: npm test
        working-directory: server

      - name: Test (client)
        run: npm test
        working-directory: client

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The real API (every route and middleware) on an in-memory MongoDB,
      # walked through every user journey over HTTP. The Playwright specs in
      # e2e/ were placeholders that skipped themselves, so this job used to
      # pass without testing anything.
      - name: Run API journeys
        run: npm run test:e2e
        timeout-minutes: 10

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Admin Dashboard
        run: npm run build
        working-directory: admin

      - name: Build Frontend Client
        run: npm run build
        working-directory: client

  deploy:
    name: Deploy
    needs: [quality, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            echo ":::: Pulling latest code ::::"
            cd ${{ env.DEPLOY_PATH }}
            git pull origin main

            echo ":::: Installing dependencies ::::"
            cd server && npm ci --production && cd ..
            cd admin && npm ci && npm run build && cd ..

            echo ":::: Restarting PM2 apps ::::"
            pm2 delete fira-backend fira-admin || true
            pm2 start ecosystem.config.js --env production
            pm2 save

            echo ":::: Deployment complete ::::"
            pm2 status
          EOF

      - name: Notify on success
        if: success()
        run: echo "✅ Deployment successful!"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed!"
